<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="100%" height="260">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0d111a" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Overhead Spotlight Volumetric Beam -->
    <radialGradient id="spotlightBeam" cx="50%" cy="0%" r="85%" fx="50%" fy="0%">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.55" />
      <stop offset="25%" stop-color="#00f5d4" stop-opacity="0.30" />
      <stop offset="60%" stop-color="#bb9af7" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#070a12" stop-opacity="0" />
    </radialGradient>

    <!-- Spotlight Cone -->
    <linearGradient id="coneGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.7" />
      <stop offset="40%" stop-color="#7aa2f7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#070a12" stop-opacity="0" />
    </linearGradient>

    <!-- 3D Chrome Text Gradient -->
    <linearGradient id="chromeText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#c0caf5" />
      <stop offset="50%" stop-color="#7aa2f7" />
      <stop offset="75%" stop-color="#bb9af7" />
      <stop offset="100%" stop-color="#00f5d4" />
    </linearGradient>

    <!-- Glow Filter for 3D Neon -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Cyber Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#7aa2f7" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#bb9af7" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <style>
    @keyframes pulseLight {
      0%, 100% { opacity: 0.85; transform: scaleY(1); }
      50% { opacity: 1; transform: scaleY(1.05); }
    }
    @keyframes scanline {
      0% { transform: translateY(0); }
      100% { transform: translateY(260px); }
    }
    @keyframes blinkCursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .spotlight-emitter {
      animation: pulseLight 3s ease-in-out infinite;
      transform-origin: 50% 0%;
    }
    .hud-title {
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      font-weight: 800;
      letter-spacing: 1.5px;
    }
  </style>

  <!-- Container Base with Rounded Cyber Corners -->
  <rect x="2" y="2" width="1196" height="256" rx="14" ry="14" fill="url(#cyberBg)" stroke="url(#borderGrad)" stroke-width="1.8" />

  <!-- 3D Perspective Grid Floor at bottom -->
  <g opacity="0.25">
    <line x1="0" y1="210" x2="1200" y2="210" stroke="#7aa2f7" stroke-width="1" />
    <line x1="0" y1="225" x2="1200" y2="225" stroke="#7aa2f7" stroke-width="1.2" />
    <line x1="0" y1="242" x2="1200" y2="242" stroke="#00f5d4" stroke-width="1.5" />
    <!-- Grid perspective vanishing lines pointing to center -->
    <line x1="600" y1="180" x2="100" y2="260" stroke="#7aa2f7" stroke-width="1" />
    <line x1="600" y1="180" x2="250" y2="260" stroke="#7aa2f7" stroke-width="1" />
    <line x1="600" y1="180" x2="420" y2="260" stroke="#7aa2f7" stroke-width="1" />
    <line x1="600" y1="180" x2="780" y2="260" stroke="#7aa2f7" stroke-width="1" />
    <line x1="600" y1="180" x2="950" y2="260" stroke="#7aa2f7" stroke-width="1" />
    <line x1="600" y1="180" x2="1100" y2="260" stroke="#7aa2f7" stroke-width="1" />
  </g>

  <!-- Spotlight Cone & Overhead Projector -->
  <g class="spotlight-emitter">
    <!-- Top projector fixture -->
    <ellipse cx="600" cy="0" rx="140" ry="24" fill="#131a29" stroke="#00f5d4" stroke-width="2" />
    <ellipse cx="600" cy="0" rx="100" ry="16" fill="#00f5d4" opacity="0.6" />
    <ellipse cx="600" cy="0" rx="60" ry="10" fill="#ffffff" />
    <!-- Volumetric light cone pouring onto name -->
    <polygon points="460,0 740,0 880,260 320,260" fill="url(#coneGrad)" />
    <!-- Radial ambient glow -->
    <rect x="0" y="0" width="1200" height="260" fill="url(#spotlightBeam)" />
  </g>

  <!-- ==================== LEFT ARCADE HUD (PLAYER 1 / LEVEL 90) ==================== -->
  <g transform="translate(45, 45)">
    <!-- HUD Box Frame -->
    <rect x="0" y="0" width="220" height="150" rx="8" fill="#090d16" fill-opacity="0.75" stroke="#7aa2f7" stroke-width="1.2" stroke-opacity="0.8" />
    <!-- Corner Accents -->
    <path d="M 0,15 L 0,0 L 15,0" fill="none" stroke="#00f5d4" stroke-width="2.5" />
    <path d="M 205,0 L 220,0 L 220,15" fill="none" stroke="#00f5d4" stroke-width="2.5" />
    <path d="M 0,135 L 0,150 L 15,150" fill="none" stroke="#00f5d4" stroke-width="2.5" />
    <path d="M 205,150 L 220,150 L 220,135" fill="none" stroke="#00f5d4" stroke-width="2.5" />

    <!-- Badge -->
    <rect x="14" y="14" width="95" height="22" rx="4" fill="#1a1b26" stroke="#00f5d4" stroke-width="1" />
    <text x="61" y="29" text-anchor="middle" fill="#00f5d4" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800">PLAYER 1</text>

    <!-- LVL 90 Indicator -->
    <text x="14" y="62" fill="#c0caf5" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">LEVEL:</text>
    <text x="70" y="62" fill="#7aa2f7" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="900">90 REPOS</text>

    <!-- Health Bar -->
    <text x="14" y="92" fill="#c0caf5" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">HP: 100%</text>
    <rect x="14" y="100" width="190" height="10" rx="3" fill="#161b26" stroke="#565f89" stroke-width="0.8" />
    <rect x="15" y="101" width="188" height="8" rx="2" fill="url(#borderGrad)" />

    <!-- Status -->
    <circle cx="22" cy="130" r="4" fill="#00f5d4">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite" />
    </circle>
    <text x="34" y="134" fill="#a9b1d6" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">STATE: OVERCLOCKED</text>
  </g>

  <!-- ==================== CENTER HERO: 3D HARI PRAJWAL UNDER SPOTLIGHT ==================== -->
  <g transform="translate(600, 105)">
    <!-- 3D Shadow Layers (Simulating Extruded Depth) -->
    <text x="0" y="24" text-anchor="middle" fill="#04060a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="62" font-weight="900" letter-spacing="4px" opacity="0.9">HARI PRAJWAL</text>
    <text x="0" y="18" text-anchor="middle" fill="#161b26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="62" font-weight="900" letter-spacing="4px">HARI PRAJWAL</text>
    <text x="0" y="12" text-anchor="middle" fill="#364a82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="62" font-weight="900" letter-spacing="4px">HARI PRAJWAL</text>
    <text x="0" y="6" text-anchor="middle" fill="#5a7fc4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="62" font-weight="900" letter-spacing="4px">HARI PRAJWAL</text>

    <!-- Foreground 3D Chrome Text with Glow -->
    <text x="0" y="0" text-anchor="middle" fill="url(#chromeText)" filter="url(#neonGlow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="62" font-weight="900" letter-spacing="4px">HARI PRAJWAL</text>

    <!-- Subtitle Banner Pill -->
    <rect x="-280" y="30" width="560" height="34" rx="17" fill="#0b0f19" fill-opacity="0.9" stroke="url(#borderGrad)" stroke-width="1.3" />
    <text x="0" y="52" text-anchor="middle" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" letter-spacing="1px">
      <tspan fill="#00f5d4">⚡ SYSTEMS ARCHITECT</tspan>
      <tspan fill="#565f89"> • </tspan>
      <tspan fill="#7aa2f7">EDGE AI</tspan>
      <tspan fill="#565f89"> • </tspan>
      <tspan fill="#bb9af7">3D SIMULATION</tspan>
      <tspan fill="#565f89"> • </tspan>
      <tspan fill="#00f5d4">AUTOMATION</tspan>
    </text>
  </g>

  <!-- ==================== RIGHT ARCADE HUD (ROLE / SCORE / QUEST) ==================== -->
  <g transform="translate(935, 45)">
    <!-- HUD Box Frame -->
    <rect x="0" y="0" width="220" height="150" rx="8" fill="#090d16" fill-opacity="0.75" stroke="#bb9af7" stroke-width="1.2" stroke-opacity="0.8" />
    <!-- Corner Accents -->
    <path d="M 0,15 L 0,0 L 15,0" fill="none" stroke="#bb9af7" stroke-width="2.5" />
    <path d="M 205,0 L 220,0 L 220,15" fill="none" stroke="#bb9af7" stroke-width="2.5" />
    <path d="M 0,135 L 0,150 L 15,150" fill="none" stroke="#bb9af7" stroke-width="2.5" />
    <path d="M 205,150 L 220,150 L 220,135" fill="none" stroke="#bb9af7" stroke-width="2.5" />

    <!-- Class Badge -->
    <rect x="14" y="14" width="130" height="22" rx="4" fill="#1a1b26" stroke="#bb9af7" stroke-width="1" />
    <text x="79" y="29" text-anchor="middle" fill="#bb9af7" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800">CLASS: ARCHITECT</text>

    <!-- Score -->
    <text x="14" y="62" fill="#c0caf5" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">TOTAL SCORE:</text>
    <text x="14" y="82" fill="#00f5d4" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="900">1,337,090 XP</text>

    <!-- Quest Status -->
    <text x="14" y="112" fill="#c0caf5" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">QUEST: CONQUER THE EDGE</text>
    <text x="14" y="134" fill="#7aa2f7" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="800">INSERT COIN ↗ PLAY</text>
  </g>

</svg>
